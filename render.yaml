# Render Blueprint — Event-Horizon
# Deploy: render.com > New > Blueprint > connect this repo.
# Note: the free plan has no persistent disk, so uploads are ephemeral; seed
# images live in the repo (attached_assets/uploads) and always work. To keep
# uploads across redeploys, switch to a paid plan and add a disk mounted at /data.
services:
  - type: web
    name: event-horizon
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false