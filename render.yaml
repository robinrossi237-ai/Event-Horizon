# Render Blueprint — Event-Horizon
# Deploy: render.com > New > Blueprint > connect this repo.
services:
  - type: web
    name: event-horizon
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false